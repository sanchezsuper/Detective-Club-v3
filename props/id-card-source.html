<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Посвідчення Служби X — макети</title>
<style>
  body { background: #b9ab8d; margin: 0; padding: 40px; display: flex; gap: 40px; flex-wrap: wrap; }
  .card { box-shadow: 0 8px 22px rgba(30,25,10,.4); border-radius: 14px; }
</style>
</head>
<body>

<!-- ЛИЦЕ -->
<svg id="front" class="card" viewBox="0 0 856 540" width="856" height="540">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3328"/>
      <stop offset="1" stop-color="#232719"/>
    </linearGradient>
    <pattern id="guilloche" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="11" fill="none" stroke="#3a4030" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="856" height="540" rx="14" fill="url(#bgF)"/>
  <rect width="856" height="540" rx="14" fill="url(#guilloche)" opacity=".5"/>
  <rect x="10" y="10" width="836" height="520" rx="10" fill="none" stroke="#8a6d1f" stroke-width="2"/>
  <!-- шапка -->
  <rect x="10" y="10" width="836" height="92" rx="10" fill="#1c2015"/>
  <rect x="10" y="70" width="836" height="32" fill="#1c2015"/>
  <text x="120" y="52" font-family="'Courier New',monospace" font-size="30" font-weight="bold" letter-spacing="8" fill="#d8cfae">СЛУЖБА X</text>
  <text x="120" y="84" font-family="'Courier New',monospace" font-size="15" letter-spacing="5" fill="#8a8a6a">ПОСВІДЧЕННЯ СПІВРОБІТНИКА · SERVICE ID</text>
  <!-- емблема -->
  <g transform="translate(66 56)">
    <circle r="34" fill="none" stroke="#8a6d1f" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#8a6d1f" stroke-width="1"/>
    <path d="M0 -20 L6 -6 L20 -4 L10 6 L13 20 L0 12 L-13 20 L-10 6 L-20 -4 L-6 -6 z" fill="#c9a437"/>
  </g>
  <!-- фото: обличчя з photoId.png, кроп 3×4 (центр по лицю), легка службова десатурація -->
  <defs>
    <clipPath id="phClip"><rect x="48" y="140" width="220" height="280" rx="6"/></clipPath>
    <filter id="idPhoto"><feColorMatrix type="saturate" values="0.72"/></filter>
  </defs>
  <rect x="48" y="140" width="220" height="280" rx="6" fill="#3c4233"/>
  <image href="photoId.png" x="-92" y="135" width="500" height="500"
         clip-path="url(#phClip)" filter="url(#idPhoto)" preserveAspectRatio="xMidYMid meet"/>
  <rect x="48" y="140" width="220" height="280" rx="6" fill="none" stroke="#8a6d1f" stroke-width="2"/>
  <!-- поля -->
  <g font-family="'Courier New',monospace">
    <text x="316" y="176" font-size="14" letter-spacing="4" fill="#8a8a6a">ПРІЗВИЩЕ, ІМ'Я</text>
    <text x="316" y="216" font-size="36" font-weight="bold" letter-spacing="4" fill="#e8e0c4">ГАЙ МИРОН</text>
    <text x="316" y="262" font-size="14" letter-spacing="4" fill="#8a8a6a">ПОСВІДЧЕННЯ №</text>
    <text x="316" y="298" font-size="30" font-weight="bold" letter-spacing="6" fill="#c9a437">X-2604</text>
    <text x="316" y="344" font-size="14" letter-spacing="4" fill="#8a8a6a">ВИДАНО</text>
    <text x="316" y="374" font-size="22" letter-spacing="3" fill="#e8e0c4">26.04.2026</text>
    <text x="576" y="344" font-size="14" letter-spacing="4" fill="#8a8a6a">ДІЙСНЕ ДО</text>
    <text x="576" y="374" font-size="22" letter-spacing="3" fill="#e8e0c4">26.04.2031</text>
    <text x="316" y="420" font-size="14" letter-spacing="4" fill="#8a8a6a">РІВЕНЬ ДОПУСКУ</text>
    <text x="576" y="452" font-size="14" letter-spacing="4" fill="#8a8a6a">ПІДПИС</text>
  </g>
  <rect x="316" y="432" width="212" height="34" rx="4" fill="#7a2320"/>
  <text x="422" y="456" text-anchor="middle" font-family="'Courier New',monospace" font-size="18" font-weight="bold" letter-spacing="6" fill="#e8e0c4">«ГЛИБИНА»</text>
  <path d="M576 468 q30 -26 60 -6 q24 16 48 -10 q14 -14 30 -2" fill="none" stroke="#c9b98a" stroke-width="2.5"/>
  <!-- нижня стрічка -->
  <rect x="10" y="492" width="836" height="38" rx="10" fill="#1c2015"/>
  <rect x="10" y="492" width="836" height="18" fill="#1c2015"/>
  <text x="428" y="517" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" letter-spacing="6" fill="#6d7458">ВЛАСНІСТЬ СЛУЖБИ X · ПІДРОБКА ПЕРЕСЛІДУЄТЬСЯ · SX-FORM 9-Б</text>
</svg>

<!-- ЗВОРОТ -->
<svg id="back" class="card" viewBox="0 0 856 540" width="856" height="540">
  <rect width="856" height="540" rx="14" fill="#282c1f"/>
  <rect width="856" height="540" rx="14" fill="url(#guilloche)" opacity=".4"/>
  <rect x="10" y="10" width="836" height="520" rx="10" fill="none" stroke="#8a6d1f" stroke-width="2"/>
  <!-- магнітна смуга -->
  <rect x="10" y="52" width="836" height="70" fill="#14160f"/>
  <!-- текст -->
  <g font-family="'Courier New',monospace" fill="#c9c2a4">
    <text x="64" y="182" font-size="19" letter-spacing="2">Пред'явник перебуває під захистом Служби X.</text>
    <text x="64" y="216" font-size="19" letter-spacing="2">Перешкоджання діяльності пред'явника тягне</text>
    <text x="64" y="250" font-size="19" letter-spacing="2">відповідальність за ст. 3-1 Статуту.</text>
    <text x="64" y="318" font-size="19" letter-spacing="2" fill="#c9a437">У разі знахідки — не повертати.</text>
    <text x="64" y="352" font-size="19" letter-spacing="2" fill="#c9a437">Знищити. Про знахідку забути.</text>
  </g>
  <!-- псевдоштрихкод -->
  <g fill="#c9c2a4">
    <rect x="64" y="404" width="4" height="70"/><rect x="74" y="404" width="2" height="70"/>
    <rect x="82" y="404" width="6" height="70"/><rect x="94" y="404" width="2" height="70"/>

    <rect x="125" y="404" width="2" height="70"/><rect x="133" y="404" width="4" height="70"/>
    <rect x="143" y="404" width="2" height="70"/><rect x="151" y="404" width="6" height="70"/>
    <rect x="163" y="404" width="3" height="70"/><rect x="172" y="404" width="2" height="70"/>
    <rect x="180" y="404" width="5" height="70"/><rect x="191" y="404" width="2" height="70"/>
    <rect x="199" y="404" width="7" height="70"/><rect x="212" y="404" width="3" height="70"/>
    <rect x="221" y="404" width="2" height="70"/><rect x="229" y="404" width="5" height="70"/>
  </g>
  <text x="64" y="500" font-family="'Courier New',monospace" font-size="15" letter-spacing="4" fill="#8a8a6a">SX·X-2604·26041908</text>
  <!-- печатка -->
  <g transform="translate(690 380) rotate(-12)">
    <circle r="72" fill="none" stroke="#7a2320" stroke-width="3" opacity=".85"/>
    <circle r="54" fill="none" stroke="#7a2320" stroke-width="1.5" opacity=".85"/>
    <path id="sealArc" d="M -60 0 A 60 60 0 1 1 60 0" fill="none"/>
    <text font-family="'Courier New',monospace" font-size="14" letter-spacing="4" fill="#7a2320" opacity=".9">
      <textPath href="#sealArc" startOffset="8">СЛУЖБА X · АРХІВ · СЛУЖБА X</textPath>
    </text>
    <path d="M0 -26 L8 -8 L26 -6 L13 8 L17 26 L0 16 L-17 26 L-13 8 L-26 -6 L-8 -8 z" fill="#7a2320" opacity=".85"/>
  </g>
</svg>

</body>
</html>
