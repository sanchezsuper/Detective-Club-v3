<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Речдоки — полароїди</title>
<style>
  body { background: #b9ab8d; margin: 0; padding: 40px; display: flex; gap: 36px; flex-wrap: wrap; font-family: 'Courier New', monospace; }
  .polaroid {
    width: 480px; background: #f8f5ee;
    padding: 22px 22px 0; box-shadow: 0 6px 18px rgba(40,30,10,.35);
  }
  .photo { width: 436px; height: 430px; background: #efe7d4; overflow: hidden; border: 1px solid #ddd3bd; }
  .caption { height: 88px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .caption b { font-size: 17px; letter-spacing: .12em; color: #2b2620; }
  .caption span { font-size: 12px; letter-spacing: .3em; color: #a8322a; }
  svg { display: block; }
</style>
</head>
<body>

<!-- ═══ РЕЧДОК 1 · ГОДИННИК (стрілки на 21:47) ═══ -->
<div class="polaroid" id="p1">
  <div class="photo">
    <svg viewBox="0 0 436 430" width="436" height="430">

      <g stroke="#2b2620" stroke-width="3">
        <line x1="218" y1="122" x2="218" y2="138"/>
        <line x1="218" y1="292" x2="218" y2="308"/>
        <line x1="125" y1="215" x2="141" y2="215"/>
        <line x1="295" y1="215" x2="311" y2="215"/>

      <g stroke="#6f6650" stroke-width="2">

        <line x1="264" y1="296" x2="257" y2="283"/>
        <line x1="172" y1="296" x2="179" y2="283"/>
        <line x1="137" y1="261" x2="150" y2="254"/>
        <line x1="137" y1="169" x2="150" y2="176"/>

      <text x="218" y="158" text-anchor="middle" font-family="Georgia" font-size="20" fill="#2b2620">12</text>
      <text x="288" y="222" text-anchor="middle" font-family="Georgia" font-size="20" fill="#2b2620">3</text>

      <g transform="rotate(293.5 218 215)">
        <path d="M218 222 L207 213 L218 162 L229 213 z" fill="#2b2620"/>
      </g>
      <g transform="rotate(282 218 215)">
        <rect x="216.2" y="120" width="3.6" height="100" fill="#2b2620"/>

      <g transform="rotate(-8 92 348)">

  </div>
  <div class="caption">
    <b>РЕЧДОК № 1 · ГОДИННИК ВЛАСНИКА</b>
    <span>НЕ ТОРКАТИСЬ</span>
  </div>
</div>
