<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Речдоки — полароїди</title>
<style>
  body { background: #b9ab8d; margin: 0; padding: 40px; display: flex; gap: 36px; flex-wrap: wrap; font-family: 'Courier New', monospace; }
  .polaroid {
    width: 480px; background: #f8f5ee;
    padding: 22px 22px 0; box-shadow: 0 6px 18px rgba(40,30,10,.35);
    position: relative;
  }
  .photo { width: 436px; height: 430px; background: #efe7d4; overflow: hidden; border: 1px solid #ddd3bd; }
  .caption {
    height: 96px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
  }
  .caption b { font-size: 17px; letter-spacing: .12em; color: #2b2620; }
  .caption span { font-size: 12px; letter-spacing: .18em; color: #837a63; }
  .case-stamp {
    position: absolute; top: 10px; right: 14px; transform: rotate(5deg);
    border: 2px double #a8322a; color: #a8322a; font-size: 10px;
    letter-spacing: .2em; padding: 2px 7px; background: rgba(248,245,238,.85);
  }
  svg { display: block; }
</style>
</head>
<body>

<!-- ═══ РЕЧДОК 1 · ГОДИННИК (стрілки на 21:47) ═══ -->

        <path d="M218 222 L207 213 L218 162 L229 213 z" fill="#2b2620"/>

  </div>
  <div class="caption">

</div>

<!-- ═══ РЕЧДОК 2 · ПІДЖАК З ЛЕЙБОЮ (…53 непомітно в тексті) ═══ -->

  </div>
  <div class="caption">
    <b>РЕЧДОК № 2 · ПІДЖАК, СЛІДИ КРОВІ</b>
    <span>ЛЕЙБА НА ПІДКЛАДЦІ · ФОТО 12.04, 22:44 · НЕ ТОРКАТИСЬ</span>

<!-- ═══ РЕЧДОК 3 · ЧАСТИНА ПІСТОЛЕТА З СЕРІЙНИКОМ (букви + 12 цифр) ═══ -->
